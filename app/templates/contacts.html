{% extends 'base.html' %}
{% from 'macros/form.html' import render_field %}

{% block content %}
<h2>Contact us</h2>

<form method="POST" novalidate>
    {{ form.hidden_tag() }}

    {{ render_field(form.name) }}
    {{ render_field(form.email) }}
    {{ render_field(form.message) }}

    {{ form.submit(class="btn btn-primary") }}
</form>

{% endblock %}
