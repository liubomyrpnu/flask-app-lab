{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Підтвердження видалення</h2>
    <p>Ви впевнені, що хочете видалити пост "<strong>{{ post.title }}</strong>"?</p>
    
    <form method="POST">
        <button type="submit" class="btn btn-danger">Так, видалити</button>
        <a href="{{ url_for('posts.index') }}" class="btn btn-secondary">Ні, скасувати</a>
    </form>
</div>
{% endblock %}
